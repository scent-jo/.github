# pnpm 저장소용 공용 PR CI (재사용 워크플로)
#
# 호출 저장소 조건: 루트 package.json의 packageManager(pnpm 버전), 커밋된 pnpm-lock.yaml,
# 실행할 루트 scripts
#
# 입력
#   node-version  Node 버전 (기본 '22')
#   scripts       순서대로 실행할 package.json 스크립트, 공백 구분 (기본 'format:check lint test')
#
# 호출 예 (호출 저장소의 .github/workflows/ci.yml)
#   on:
#     pull_request:
#   permissions:
#     contents: read
#   jobs:
#     ci:
#       uses: scent-jo/.github/.github/workflows/pnpm-ci.yml@main
#       with:
#         node-version: '22'
#         scripts: 'format:check lint test'

name: pnpm CI

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '22'
      scripts:
        type: string
        default: 'format:check lint test'

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run scripts
        env:
          SCRIPTS: ${{ inputs.scripts }}
        run: |
          read -ra scripts <<< "$SCRIPTS"
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "::error::scripts 입력이 비어 있습니다"
            exit 1
          fi
          for s in "${scripts[@]}"; do
            pnpm run "$s"
          done
